<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE1D7">
<meta name="mobile-web-app-capable" content="yes">
<title>Recipes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--paper:#FFE1D7;--ink:#0259DD;--mute:#6A86C4;--line:#F4CBBE;--sky:#84AFFB;--coral:#FF6648;--blue:#0259DD;--cream:#FFE1D7;--white:#FFF6F1;--peach:#F9CDBD;--palesky:#CADDFB;--palecoral:#FFC3B3;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;overscroll-behavior-y:none}
  body{display:flex;flex-direction:column}
  button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
  button{cursor:pointer}
  a{color:inherit}
  #pin{position:sticky;top:0;z-index:40;padding:calc(var(--safe-top) + 6px) 12px 0;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
  #pin:empty{display:none}
  #view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(72px + var(--safe-bottom));-webkit-overflow-scrolling:touch}
  #nav{position:fixed;left:0;right:0;bottom:0;height:calc(60px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:flex;justify-content:space-around;align-items:center;background:var(--paper);border-top:1px solid var(--line);z-index:30}
  #nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);padding:6px 14px}
  #nav button.on{color:var(--ink)}
  #nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .tile{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--tb);color:var(--ti)}
  .tile svg{width:54%;height:54%;fill:var(--ti)}
  .tile svg .cut{stroke:var(--tb);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tile svg .dot{fill:var(--tb)}
  .tile svg .ln{stroke:var(--ti);fill:none;stroke-width:1.6;stroke-linecap:round}

  .hd{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top) + 12px) 18px 6px}
  .hd h1{font-size:21px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
  .rbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);flex:0 0 auto}
  .rbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pill{font-size:12.5px;font-weight:700;color:var(--cream);background:var(--blue);border-radius:16px;padding:8px 14px;flex:0 0 auto}
  .pill.ghost{background:none;color:var(--ink);border:1.5px solid var(--sky)}
  .pill.danger{background:none;color:var(--coral);border:1.5px solid var(--palecoral)}

  .p{padding:0 18px}
  .lbl{font-size:11px;font-weight:600;color:var(--mute);margin:14px 0 6px}
  .fld{display:block;width:100%;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;min-height:40px;color:var(--ink)}
  .fld::placeholder{color:var(--mute);font-weight:400}
  textarea.fld{resize:vertical;line-height:1.5;min-height:80px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{font-size:12px;font-weight:600;padding:6px 11px;border-radius:14px;border:1px solid var(--line);color:var(--mute);background:var(--white)}
  .chips button.on{background:var(--blue);color:var(--cream);border-color:var(--blue)}
  .primary{display:block;width:100%;text-align:center;background:var(--blue);color:var(--cream);font-size:14px;font-weight:700;border-radius:14px;padding:13px}
  .ghostbtn{display:block;width:100%;text-align:center;border:1.5px solid var(--sky);color:var(--ink);font-size:13.5px;font-weight:600;border-radius:14px;padding:11px;background:var(--white)}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;font-size:12px;font-weight:600;background:var(--white)}
  .seg button{flex:1;text-align:center;padding:8px 6px;border-radius:9px;color:var(--mute)}
  .seg button.on{background:var(--blue);color:var(--cream)}
  .empty{padding:40px 24px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.6}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

  /* library */
  .top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top) + 12px) 20px 0}
  .top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .search{margin:10px 18px 0;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:0 6px 0 12px;height:38px}
  .search input{flex:1;font-size:14px}
  .car{display:flex;overflow-x:auto;padding:14px calc(50% - 92px) 6px;scrollbar-width:none;height:238px;align-items:center;touch-action:pan-x}
  .car::-webkit-scrollbar{display:none}
  .slide{flex:0 0 184px;position:relative;margin:0 -22px;will-change:transform;background:none;display:flex;flex-direction:column;align-items:center;padding:0}
  .slide .disc{width:156px;height:156px;border-radius:50%;overflow:hidden;border:5px solid var(--tb);background:var(--tb);flex:0 0 auto}
  .slide .disc img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
  .slide .disc .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--tb)}
  .slide .disc .ph svg{width:46%;height:46%;fill:var(--ti)}
  .slide .disc .ph svg .cut{stroke:var(--tb);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .slide .disc .ph svg .dot{fill:var(--tb)}
  .slide .disc .ph svg .ln{stroke:var(--ti);fill:none;stroke-width:1.6;stroke-linecap:round}
  .slide .pill{margin-top:-17px;position:relative;z-index:2;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:700;line-height:1.15;border-radius:16px;padding:7px 13px;max-width:180px;text-align:center;border:3px solid var(--paper);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:0;transition:opacity .15s}
  .slide.mid .pill{opacity:1}
  .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
  .prog div{height:100%;background:var(--blue);transition:width .3s}
  .pick.ok h3{color:var(--mute)}
  .pick.fail small{color:var(--coral)}
  .tabs{display:flex;gap:16px;padding:8px 20px 0;font-size:12.5px;font-weight:600;color:var(--mute);overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);margin:0 0 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding-bottom:9px;border-bottom:1.5px solid transparent;margin-bottom:-1px;color:var(--mute);flex:0 0 auto}
  .tabs button.on{color:var(--ink);border-color:var(--ink)}
  .row{display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;text-align:left}
  .row .tile{width:44px;height:44px}
  .row>div:not(.tile):not(.cb){flex:1;min-width:0}
  .row h3{font-size:14px;font-weight:600;line-height:1.25}
  .row p{font-size:11px;color:var(--mute);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc{font-size:14px;font-weight:700;color:var(--coral);flex:0 0 auto}

  /* recipe */
  .rtop{position:relative;height:calc(250px + var(--safe-top));background:transparent;color:var(--ti);padding-top:var(--safe-top)}
  .rtop .wrap{position:absolute;left:0;top:var(--safe-top);width:100%;height:250px;display:block}
  .rtop .rbtn{position:absolute;top:calc(var(--safe-top) + 12px);border-color:var(--ti);color:var(--ti);z-index:3}
  .rtop .b1{left:18px}.rtop .b2{left:60px}
  .rtop .cart{position:absolute;right:82px;top:calc(var(--safe-top) + 12px);width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ti);color:var(--ti);display:flex;align-items:center;justify-content:center;z-index:3}
  .rtop .cart svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rtop .edit{position:absolute;right:18px;top:calc(var(--safe-top) + 12px);font-size:12px;font-weight:700;z-index:3;border:1.5px solid var(--ti);border-radius:16px;padding:7px 12px;color:var(--ti)}
  .photo{position:absolute;right:-50px;top:calc(var(--safe-top) + 66px);width:220px;height:220px;border-radius:50%;background:var(--ti);overflow:hidden;border:6px solid var(--ti);z-index:2}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
  .photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--tb)}
  .photo .ph svg{width:44%;height:44%;fill:var(--ti)}
  .photo .ph svg .cut{stroke:var(--tb);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .photo .ph svg .dot{fill:var(--tb)}
  .photo .ph svg .ln{stroke:var(--ti);fill:none;stroke-width:1.6;stroke-linecap:round}
  .rtop .tile.badge{position:absolute;left:22px;top:calc(var(--safe-top) + 178px);width:44px;height:44px;border:2px solid var(--ti);z-index:3}
  .r{padding:48px 18px 0}
  .r h1{font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.015em}
  .meta{font-size:12px;color:var(--mute);margin:8px 0 6px;font-weight:500;line-height:1.6}
  .meta b{color:var(--coral);font-weight:700}
  .src{font-size:12.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--sky);font-weight:600;margin-bottom:12px;display:inline-block}
  .serv{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px}
  .serv .st{display:flex;align-items:center;gap:8px;color:var(--ink)}
  .serv .st button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sky);font-size:16px;line-height:1;color:var(--ink)}
  .ing{font-size:14px;line-height:1.5}
  .ing div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:9px 0}
  .ing b{font-weight:600;white-space:nowrap;text-align:right}
  .ing small{display:block;font-size:11px;color:var(--mute);font-weight:500}
  .step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.55;width:100%;text-align:left}
  .step i{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--sky);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;color:var(--ink)}
  .step.done i{background:var(--blue);border-color:var(--blue);color:var(--cream)}
  .step.done .txt{color:var(--mute)}
  .step .txt{flex:1;min-width:0}
  .chip{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;border:1.5px solid var(--sky);border-radius:12px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink);background:var(--white)}
  .chip.run{background:var(--coral);color:var(--cream);border-color:var(--coral)}
  .chip.run b{font-variant-numeric:tabular-nums}
  .notes{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;margin-top:6px}
  .rate{display:flex;gap:4px;margin-top:6px}
  .rate button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute);background:var(--white)}
  .rate button.on{background:var(--coral);color:var(--cream);border-color:var(--coral)}

  /* pinned timer */
  .tm{display:flex;align-items:center;gap:10px;background:var(--tb);color:var(--ti);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:600;width:100%;text-align:left}
  .tm .tile{width:26px;height:26px;border:1.5px solid var(--ti)}
  .tm .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .what small{display:block;font-size:10.5px;opacity:.8;font-weight:500}
  .tm b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .tm.over b{animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.35}}
  .tm .x{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ti);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ti);flex:0 0 auto}

  /* sheet */
  .dim{position:fixed;inset:0;background:rgba(2,89,221,.18);z-index:50}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + var(--safe-bottom));z-index:51;max-height:88vh;overflow-y:auto}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{font-size:18px;font-weight:700;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;width:100%;text-align:left}
  .opt .tile{width:40px;height:40px;font-size:16px}
  .opt small{display:block;font-size:11.5px;color:var(--mute);font-weight:500;margin-top:2px}

  /* edit */
  .irow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .irow .fld{padding:8px 10px;min-height:38px;font-size:13.5px}
  .irow .q{flex:0 0 58px;text-align:right}.irow .u{flex:0 0 62px;padding:8px 4px;text-align:center;appearance:none}.irow .n{flex:1;min-width:0}
  .irow .h{color:var(--sky);font-size:16px;flex:0 0 18px;text-align:center;touch-action:none}
  .irow .del{color:var(--mute);flex:0 0 22px;text-align:center;font-size:14px}
  .icons{display:flex;gap:8px;flex-wrap:wrap}
  .icons .tile{width:40px;height:40px}
  .icons .tile.sel{outline:2px solid var(--blue);outline-offset:2px}
  .crop{width:170px;height:170px;border-radius:50%;background:var(--white);border:1.5px solid var(--sky);overflow:hidden;margin:6px auto;position:relative;touch-action:none}
  .crop img{width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none}
  .crop .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
  .cropctl{display:flex;gap:8px;align-items:center;margin-top:4px}
  .cropctl input[type=range]{flex:1;accent-color:var(--blue)}
  .steprow{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start}
  .steprow i{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--sky);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:8px}
  .steprow textarea{flex:1;min-height:44px}
  .steprow .del{color:var(--mute);margin-top:10px;font-size:14px}

  /* shopping */
  .pick{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
  .pick .tile{width:36px;height:36px}
  .pick>div:not(.tile):not(.cb){flex:1;min-width:0}
  .pick h3{font-size:13.5px;font-weight:600}
  .pick small{font-size:11px;color:var(--mute);font-weight:500}
  .cb{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sky);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cream)}
  .cb.on{background:var(--blue);border-color:var(--blue)}
  .mult{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .mult button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:14px;color:var(--ink)}
  .mult span{font-size:12px;font-weight:700;min-width:30px;text-align:center}
  .grp{font-size:11px;font-weight:600;color:var(--mute);margin:14px 0 2px}
  .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:500;width:100%;text-align:left}
  .li span{flex:1;min-width:0}
  .li b{font-weight:600;white-space:nowrap}
  .li.done span,.li.done b{color:var(--mute);text-decoration:line-through}
  .li small{font-size:10.5px;color:var(--mute);font-weight:500;margin-left:6px;text-decoration:none}
  .foot{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 18px;background:var(--paper)}

  /* settings */
  .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
  .srow>div:first-child{flex:1;min-width:0}
  .srow small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:2px}
  .seg.sm{font-size:11px}.seg.sm button{padding:6px 8px}
  .sw{width:40px;height:22px;border-radius:11px;background:var(--blue);position:relative;flex:0 0 auto}
  .sw::after{content:"";position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--cream)}
  .sw.off{background:var(--line)}.sw.off::after{right:auto;left:2px}
  .sec{font-size:16px;font-weight:700;margin:20px 0 4px}

  .tcs{display:flex;flex-wrap:wrap;gap:6px}
  .tc{display:flex;align-items:center;gap:6px;background:var(--tb);color:var(--ti);border-radius:12px;padding:5px 9px 5px 6px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .tc .tile{width:20px;height:20px;border:1.5px solid var(--ti)}
  .tc.over b{animation:blink 1s step-start infinite}
  .nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .nut div{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
  .nut small{display:block;font-size:10px;color:var(--mute);font-weight:600}
  .nut b{font-size:14px;font-weight:700}
  .thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .thumb{width:72px;height:72px;border-radius:12px;overflow:hidden;flex:0 0 auto;border:2px solid transparent;background:var(--white)}
  .thumb.sel{border-color:var(--blue)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  details summary{cursor:pointer;font-weight:600}

  .rw{position:relative;overflow:hidden}
  .rw .acts{position:absolute;left:0;top:0;bottom:0;display:flex;gap:6px;align-items:center;padding-left:14px}
  .rw .act{height:40px;padding:0 14px;border-radius:12px;background:var(--blue);color:var(--cream);font-size:12.5px;font-weight:700}
  .rw .act.del{background:var(--coral)}
  .rw .row{position:relative;background:var(--paper);touch-action:pan-y;will-change:transform}
  .row .cb{margin-right:2px}

  .stv{font-weight:700;font-size:12.5px;min-width:44px;padding:4px 4px;text-align:center;color:var(--ink);line-height:1}
  .ifilter{display:flex;align-items:center;gap:10px;padding:10px 20px 4px;font-size:13px;font-weight:600}
  .ifilter .tile{width:30px;height:30px;flex:0 0 30px}
  .ifilter span{flex:1}
  .ifilter button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);color:var(--mute);font-size:12px}
  button.tile.badge{cursor:pointer}
  .ing div.messy b{color:var(--coral)}
  .ing div.messy span::after{content:' ?';color:var(--coral);font-weight:700}
  .irow.messy .n{border-color:var(--coral)}
  .toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-bottom));transform:translateX(-50%);background:var(--blue);color:var(--cream);font-size:13px;font-weight:600;padding:10px 16px;border-radius:14px;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="pin"></div>
<div id="view"></div>
<nav id="nav">
